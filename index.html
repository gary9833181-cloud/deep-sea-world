<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#031b2d">
<title>深海秘境｜3D 探索</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031b2d;color:#e9fbff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none}
  #top{position:absolute;left:14px;top:12px;padding:9px 12px;border:1px solid #8bdcf055;background:#06283a99;border-radius:12px;backdrop-filter:blur(8px)}
  #top strong{display:block;font-size:14px;letter-spacing:.12em} #status{font-size:11px;color:#a8d9e7;margin-top:3px}
  #help{position:absolute;right:12px;top:12px;max-width:170px;text-align:right;font-size:11px;line-height:1.55;color:#d0f1f7;background:#06283a88;padding:8px 10px;border-radius:10px}
  #cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #b8f6ff88;border-radius:50%;transform:translate(-50%,-50%)}
  #pad{position:absolute;left:18px;bottom:25px;width:124px;height:124px;border-radius:50%;border:1px solid #b7f4ff55;background:#06283a66;pointer-events:auto;touch-action:none}
  #nub{position:absolute;left:38px;top:38px;width:46px;height:46px;border-radius:50%;background:#8ceaff55;border:1px solid #b9f7ff99}
  #look{position:absolute;right:0;bottom:0;width:58%;height:58%;pointer-events:auto;touch-action:none}
  #buttons{position:absolute;right:15px;bottom:25px;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
  .btn{border:1px solid #b9f7ff66;background:#06283abf;color:#eaffff;border-radius:13px;padding:12px 15px;font-size:13px;min-width:66px;touch-action:none}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10px;color:#a7dce8;white-space:nowrap;text-shadow:0 1px 4px #001}
  #error{display:none;position:fixed;inset:15% 8% auto;padding:18px;background:#102f40;border:1px solid #7de6f5;border-radius:14px;line-height:1.6}
  @media(min-width:800px){#pad{opacity:.7}#help{font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top"><strong>深海秘境</strong><div id="status">正在啟動 WebGPU…</div></div>
  <div id="help">左側圓盤：移動<br>右側拖曳：轉動視角<br>上升／下降：垂直移動</div>
  <div id="cross"></div>
  <div id="pad"><div id="nub"></div></div>
  <div id="look"></div>
  <div id="buttons"><button class="btn" id="up">上升 ▲</button><button class="btn" id="down">下降 ▼</button><button class="btn" id="boost">加速：關</button></div>
  <div id="hint">拖曳右側畫面環顧四周，探索發光海底</div>
</div>
<div id="error"></div>
<script type="module">
const canvas=document.querySelector('#c'), status=document.querySelector('#status'), err=document.querySelector('#error');
const pad=document.querySelector('#pad'), nub=document.querySelector('#nub'), look=document.querySelector('#look');
const state={x:0,y:2.0,z:0,yaw:Math.PI,pitch:-.06,joyX:0,joyY:0,up:0,down:0,boost:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fail(msg){err.style.display='block';err.textContent=msg;status.textContent='無法啟動';}
if(!navigator.gpu){fail('這個瀏覽器目前沒有 WebGPU。請使用支援 WebGPU 的新版 Android Chrome，並確認手機系統與瀏覽器已更新。若仍無法使用，可換支援 WebGPU 的電腦瀏覽器。');throw new Error('WebGPU unavailable');}
try{
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter) throw new Error('找不到可用的 GPU adapter');
 const device=await adapter.requestDevice();
 const ctx=canvas.getContext('webgpu');
 const format=navigator.gpu.getPreferredCanvasFormat();
 const shader=`
struct U { resolution:vec2f, time:f32, yaw:f32, pitch:f32, cam:vec3f, };
@group(0) @binding(0) var<uniform> u:U;
fn hash31(p:vec3f)->f32 { return fract(sin(dot(p,vec3f(127.1,311.7,74.7)))*43758.5453); }
fn noise3(p0:vec3f)->f32 {
 let i=floor(p0); let f=fract(p0); let u2=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash31(i),hash31(i+vec3f(1,0,0)),u2.x),mix(hash31(i+vec3f(0,1,0)),hash31(i+vec3f(1,1,0)),u2.x),u2.y),
            mix(mix(hash31(i+vec3f(0,0,1)),hash31(i+vec3f(1,0,1)),u2.x),mix(hash31(i+vec3f(0,1,1)),hash31(i+vec3f(1,1,1)),u2.x),u2.y),u2.z);
}
fn sdSphere(p:vec3f,r:f32)->f32{return length(p)-r;}
fn scene(p:vec3f)->vec2f{
 var d=p.y+2.4;
 var mat=1.0;
 // uneven seabed
 d=p.y+2.35+0.12*sin(p.x*1.4)*sin(p.z*1.2)+0.07*noise3(p*2.0);
 // scattered rounded rocks
 let cell=floor((p.xz+vec2f(30.0))/4.0);
 let rnd=hash31(vec3f(cell.x,0.0,cell.y));
 let center=vec3f(cell.x*4.0-28.0,-1.8+0.5*rnd,cell.y*4.0-28.0);
 let rock=sdSphere(p-center,0.55+0.8*rnd);
 if(rock<d){d=rock;mat=2.0;}
 // towering kelp trunks and swaying fronds
 for(var i=0;i<9;i++){
  let fi=f32(i);
  let bx=(fi-4.0)*2.7;
  let bz=-7.0-f32(i%3)*3.0;
  let sway=sin(u.time*0.65+fi)*0.32;
  let q=p-vec3f(bx+sway*0.4,0.0,bz);
  let trunk=length(q.xz)-0.105-0.06*noise3(vec3f(q.x*3.0,q.y*0.5,q.z*3.0));
  let vertical=max(trunk, max(-q.y-2.25,q.y-5.8));
  if(vertical<d){d=vertical;mat=3.0;}
  for(var j=0;j<5;j++){
   let h=0.1+f32(j)*0.78;
   let leafY=q.y-h;
   let leafX=q.x-(sway+sin(u.time*0.9+fi+f32(j))*0.38)*(q.y*0.16+0.4);
   let leafZ=q.z-0.2;
   let leaf=length(vec2f(leafX*0.55,leafZ+0.04*sin(q.y*2.0)))-0.20*(1.0-f32(j)*0.08);
   let ld=max(leaf,abs(leafY)-0.11);
   if(ld<d){d=ld;mat=4.0;}
  }
 }
 // luminous coral clusters
 for(var k=0;k<8;k++){
  let fk=f32(k);
  let cx=sin(fk*8.1)*8.0; let cz=-5.0-cos(fk*3.7)*8.0;
  let q=p-vec3f(cx,-1.7,cz);
  let stem=length(q.xz)-0.12-0.10*max(0.0,q.y);
  let branch=length(vec2f(length(q.xz)-0.32,q.y-0.75))-0.13;
  let cd=min(stem,branch);
  if(cd<d){d=cd;mat=5.0;}
 }
 // distant arch silhouette
 let archP=p-vec3f(0.0,0.2,-17.0);
 let arch=max(abs(length(vec2f(archP.x,archP.y-1.2))-3.4)-0.28,abs(archP.z)-0.45);
 if(arch<d){d=arch;mat=6.0;}
 return vec2f(d,mat);
}
fn normal(p:vec3f)->vec3f{
 let e=0.002;
 return normalize(vec3f(scene(p+vec3f(e,0,0)).x-scene(p-vec3f(e,0,0)).x,
 scene(p+vec3f(0,e,0)).x-scene(p-vec3f(0,e,0)).x,
 scene(p+vec3f(0,0,e)).x-scene(p-vec3f(0,0,e)).x));
}
@vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4f{
 var p=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));
 return vec4f(p[i],0,1);
}
@fragment fn fs(@builtin(position) pix:vec4f)->@location(0) vec4f{
 let uv=(pix.xy*2.0-u.resolution)/u.resolution.y;
 let cp=cos(u.pitch); let sp=sin(u.pitch); let cy=cos(u.yaw); let sy=sin(u.yaw);
 let local=normalize(vec3f(uv.x,uv.y,1.35));
 let pitchDir=vec3f(local.x,local.y*cp-local.z*sp,local.y*sp+local.z*cp);
 let rd=normalize(vec3f(pitchDir.x*cy+pitchDir.z*sy,pitchDir.y,-pitchDir.x*sy+pitchDir.z*cy));
 let ro=u.cam;
 let skyTop=vec3f(0.015,0.10,0.19); let skyBottom=vec3f(0.015,0.30,0.39);
 var col=mix(skyBottom,skyTop,clamp(rd.y*0.7+0.5,0.0,1.0));
 // surface glow and light shafts
 let shafts=pow(max(0.0,sin(rd.x*12.0+u.time*0.15)),18.0)*max(rd.y,0.0);
 col+=vec3f(0.08,0.30,0.34)*shafts*0.35;
 var t=0.0; var hit=false; var material=0.0; var pos=ro;
 for(var i=0;i<72;i++){
  pos=ro+rd*t;
  let h=scene(pos);
  if(h.x<0.012){hit=true;material=h.y;break;}
  t+=max(h.x*0.72,0.025);
  if(t>42.0){break;}
 }
 if(hit){
  let n=normal(pos);
  let light=normalize(vec3f(-0.45,0.9,-0.35));
  let diff=max(dot(n,light),0.0);
  let fog=exp(-t*0.055);
  var base=vec3f(0.12,0.24,0.23);
  if(material>1.5 && material<2.5){base=vec3f(0.10,0.20,0.23);}
  if(material>2.5 && material<3.5){base=vec3f(0.025,0.22,0.17);}
  if(material>3.5 && material<4.5){base=vec3f(0.08,0.48,0.36);}
  if(material>4.5 && material<5.5){base=vec3f(0.15,0.72,0.62);}
  if(material>5.5){base=vec3f(0.13,0.25,0.34);}
  let glow=select(0.0,0.55,material>3.5 && material<5.5);
  let lit=base*(0.22+diff*0.85)+vec3f(0.03,0.14,0.17)*glow;
  col=mix(col,lit,fog);
 }
 // floating specks and bubbles
 let starUV=uv*vec2f(30.0,18.0)+vec2f(u.time*0.12,u.time*0.06);
 let grid=floor(vec3f(starUV, t*0.2));
 let rnd=hash31(grid);
 let sparkle=step(0.993,rnd)*smoothstep(-0.1,0.5,rd.y);
 col+=vec3f(0.20,0.75,0.75)*sparkle*0.65;
 let vignette=1.0-0.22*dot(uv,uv);
 col*=vignette;
 return vec4f(pow(max(col,vec3f(0.0)),vec3f(0.92)),1.0);
}`;
 const module=device.createShaderModule({code:shader});
 const pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
 const uniform=device.createBuffer({size:48,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
 const bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniform}}]});
 function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.floor(innerWidth*dpr));canvas.height=Math.max(1,Math.floor(innerHeight*dpr));
  ctx.configure({device,format,alphaMode:'opaque'});
 }
 addEventListener('resize',resize);resize();
 let last=performance.now();
 function frame(now){
  const dt=Math.min((now-last)/1000,0.04);last=now;
  const speed=state.boost?5.0:2.0;
  const forward=-state.joyY, strafe=state.joyX;
  state.x+=(Math.sin(state.yaw)*forward+Math.cos(state.yaw)*strafe)*speed*dt;
  state.z+=(Math.cos(state.yaw)*forward-Math.sin(state.yaw)*strafe)*speed*dt;
  state.y+=(state.up-state.down)*speed*dt;
  state.y=clamp(state.y,-1.2,7.0);
  const data=new Float32Array([canvas.width,canvas.height,now/1000,state.yaw,state.pitch,0,0,0,state.x,state.y,state.z,0]);
  device.queue.writeBuffer(uniform,0,data);
  const enc=device.createCommandEncoder();const pass=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),clearValue:{r:0,g:0.08,b:0.14,a:1},loadOp:'clear',storeOp:'store'}]});
  pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.draw(3);pass.end();device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
 }
 status.textContent='WebGPU 已啟動・觸控探索中';requestAnimationFrame(frame);
}catch(e){console.error(e);fail('啟動失敗：'+e.message+'。請改用最新版 Chrome，並確認裝置支援 WebGPU。');}

// Touch joystick
let padId=null;
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(padId);movePad(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)movePad(e);});
function movePad(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),m=38;if(len>m){dx=dx/len*m;dy=dy/len*m;}state.joyX=dx/m;state.joyY=dy/m;nub.style.transform=`translate(${dx}px,${dy}px)`;}
function endPad(){padId=null;state.joyX=state.joyY=0;nub.style.transform='translate(0,0)';}
pad.addEventListener('pointerup',endPad);pad.addEventListener('pointercancel',endPad);
let lookId=null,lx=0,ly=0;
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lookId);});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;state.yaw-=dx*0.005;state.pitch=clamp(state.pitch+dy*0.004,-1.1,1.1);});
look.addEventListener('pointerup',()=>lookId=null);look.addEventListener('pointercancel',()=>lookId=null);
function hold(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();state[key]=1;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>state[key]=0));}
hold('up','up');hold('down','down');
document.querySelector('#boost').addEventListener('click',e=>{state.boost=!state.boost;e.currentTarget.textContent='加速：'+(state.boost?'開':'關');});
</script>
</body></html>
